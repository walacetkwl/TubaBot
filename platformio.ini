; TubaBot v3 — firmware para a ES3C28P (ESP32-S3, tela 2,8" em paisagem 320×240)
; Build:   pio run -e tubabot
; UM firmware para todas as unidades: Lite/Pro, cor e padrões vêm do perfil de
; fábrica (partição "fabrica", gerado por tools/fabrica.py).
;
; Arduino-ESP32 3.x via pioarduino (a plataforma oficial do PlatformIO parou no 2.x;
; ESP_I2S e o Arduino_GFX atual exigem o core 3.x).
; Versões FIXADAS para builds reprodutíveis.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = tubabot

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi     ; ESP32-S3R8: PSRAM octal de 8 MB
board_build.partitions = firmware/partitions_tubabot.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 921600
; biblioteca pela tag do GitHub (versão fixada)
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.4
build_unflags = -std=gnu++11 -std=gnu++2b
build_src_filter = +<*> +<../../core/*.cpp>
build_flags =
    -std=gnu++17
    -I core
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -ffp-contract=off
extra_scripts = pre:tools/pio_embed_portal.py

[env:tubabot]
build_flags = ${env.build_flags} -DTB_ENV_NAME=\"tubabot\"
