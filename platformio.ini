; TubaBot — firmware ESP32-C3 Super Mini
; Builds:  pio run -e tubabot      (completo: buzzer ativo + vibração)
;          pio run -e tubabot_lite (Lite: só visor e toque)
;
; Versões FIXADAS (mesma base da referência consultada, commit ce4ccfc do YETI):
;   plataforma espressif32 6.9.0 + Arduino-ESP32 2.0.17 (framework 3.20017) + toolchain RISC-V 12.2.0
; Estas versões NÃO puderam ser baixadas no ambiente onde o projeto foi escrito
; (registro do PlatformIO bloqueado); veja docs/VALIDACAO.md.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = tubabot, tubabot_lite

[env]
platform = espressif32@6.9.0
; mesmos pacotes que a referência usa (toolchain nativo também para Apple Silicon)
platform_packages =
    espressif/toolchain-riscv32-esp@12.2.0+20230208
    platformio/framework-arduinoespressif32@~3.20017.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = firmware/partitions_tubabot.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 460800
build_unflags = -std=gnu++11
build_src_filter = +<*> +<../../core/*.cpp>
build_flags =
    -std=gnu++17
    -I core
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -march=rv32imc_zicsr_zifencei
extra_scripts = pre:tools/pio_embed_portal.py

[env:tubabot]
build_flags = ${env.build_flags} -DTB_MODEL_FULL=1 -DTB_ENV_NAME=\"tubabot\"

[env:tubabot_lite]
build_flags = ${env.build_flags} -DTB_MODEL_FULL=0 -DTB_ENV_NAME=\"tubabot_lite\"
